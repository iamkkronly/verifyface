# verifyface release — Developer: Kaustav Kanti Ray
# Publishes to PyPI when a tag like v1.0.0 is pushed.
# Uses PyPI Trusted Publishing (no token in the repository).
name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write        # required for PyPI trusted publishing

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # trusted publishing needs this environment registered on PyPI;
          # alternatively set the PYPI_API_TOKEN secret and use password:
          #   password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
